interface:
  display_name: "Generate WinkNotes Cards"
  short_description: "Write v2 winkmd cards with categories and media"
  default_prompt: "Use $generate-twinkling-pack to turn this source into source-grounded .winkmd flashcards. Include useful recall and choice questions, hierarchical categories and optional stars. Put translations and notes inside mute tags and hints in collapsed details. Deliver a validated .winkmd file, or a ZIP with media when needed."
