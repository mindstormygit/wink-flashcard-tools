interface:
  display_name: "Generate Twinkling Pack"
  short_description: "Build mixed note and choice .wink study packs"
  default_prompt: "Use $generate-twinkling-pack to turn this PDF or source material into an importable .wink flashcard pack that mixes recall-oriented note cards with useful single- or multiple-answer choice cards, shared tags, rich text, inline images, and native image occlusions where appropriate."
